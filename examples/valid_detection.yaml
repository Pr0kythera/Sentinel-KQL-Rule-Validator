# Example Valid Microsoft Sentinel Analytics Rule
# Demonstrates a properly formatted detection that passes all validators
# (with KQL validation, the entity/customDetails columns must exist in the query
# output; the query below emits AccountCustomEntity, HostCustomEntity, CommandLine).

id: b1c2d3e4-f5a6-7890-bcde-f12345678999
name: "Suspicious PowerShell Command Execution"
displayName: "Suspicious PowerShell Command Execution with Encoding"
version: "1.0.0"
lastModified: "2026-01-05T12:45:00"
kind: "Scheduled"
description: "Detects PowerShell command execution with suspicious flags that may indicate an attempt to evade detection or execute payloads."
severity: "High"
enabled: true

# Metadata (Task 4)
author: "contact.prokythera@gmail.com"
creationDate: 2026-01-01T09:00:00
reviewDate: 2027-06-01T09:00:00
environment: "Production"
tables:
  - "SecurityEvent"

queryFrequency: "5m"
queryPeriod: "5m"
triggerOperator: "GreaterThan"
triggerThreshold: 0
tactics:
  - "Execution"
relevantTechniques:
  - "T1059.001"
query: |
  SecurityEvent
  | where TimeGenerated >= ago(5m)
  | where EventID == 4688 and CommandLine has "powershell.exe"
  | where CommandLine has_any("-EncodedCommand", "-NonInteractive", "-ExecutionPolicy Bypass", "IEX")
  | summarize count() by Computer, Account, CommandLine, bin(TimeGenerated, 5m)
  | extend AccountCustomEntity = Account, HostCustomEntity = Computer
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: "24h"
    matchingMethod: "Selected"
    groupByEntities:
      - "Account"
      - "Host"
    groupByAlertDetails:
      - "AlertDisplayName"
    groupByCustomDetails:
      - "CommandLine"
eventGroupingSettings:
  aggregationKind: "AlertPerResult"
entityMappings:
  - entityType: "Account"
    fieldMappings:
      - identifier: "FullName"
        columnName: "AccountCustomEntity"
  - entityType: "Host"
    fieldMappings:
      - identifier: "FullName"
        columnName: "HostCustomEntity"
customDetails:
  CommandLine: CommandLine
