# Example Invalid Microsoft Sentinel Analytics Rule
# This file intentionally contains errors for testing

# ERROR: Invalid GUID format
id: b1c2d3e4-f5a6-7890-bcde-f12345678901

name: "Test Invalid Detection"
displayName: "Test Invalid Detection Display Name"
version: "1.0.0"
kind: "Scheduled"

description: "This is a test detection with intentional errors"

severity: "High"  # ERROR: Invalid severity level

# ERROR: Boolean as string instead of bool
enabled: true

# ERROR: queryFrequency exceeds queryPeriod
queryFrequency: "1h"
queryPeriod: "30m"

triggerOperator: "GreaterThan"
triggerThreshold: 0

tactics:
  - "Initial Access"

# Error: Invalid technique ID format
relevantTechniques:
  - "T1078"

# ERROR: Invalid KQL syntax (typo in 'sort')
query: |
  SecurityEvent
  | where EventID == 4625
  | sorty by TimeGenerated desc
  | projectf TimeGenerated, Computer, Account, IpAddress
  | extend AccountEntity = Account, Hostentity = Computer

suppressionEnabled: false

incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: false
    reopenClosedIncident: false
    lookbackDuration: "5m"
    matchingMethod: "AllEntities"
eventGroupingSettings:
  aggregationKind: "SingleAlert"

# ERROR: Entity mapping references column not in query output and too many field mappings
entityMappings:
  - entityype: "Account"
    fieldMappings:
      - identifier: "Name"
        columnName: "NonExistentColumn"
        fieldMappings:
      - identifier: "DnsDomain"
        columnName: "NonExistentColumn"
        fieldMappings:
      - identifier: "UPNSuffix"
        columnName: "NonExistentColumn"
        fieldMappings:
      - identifier: "Sid"
        columnName: "NonExistentColumn"
        fieldMappings:
      - identifier: "AadTenantId"
        columnName: "NonExistentColumn"
  - entityType: "Host"
    fieldMappings:
      - identifier: "HostName"
        columnName: "HostEntity"
customDetails:
  CompositeZScore: CompositeZScore
  CompositeZScore: CompositeZScore
