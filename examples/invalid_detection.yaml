# Example Invalid Microsoft Sentinel Analytics Rule
# This file intentionally contains errors for testing. Real errors it triggers:
#   - tactic "Initial Access" contains spaces (must be "InitialAccess")
#   - entityMappings uses "entityype" (typo, missing "entityType")
#   - customDetails declares the key "CompositeZScore" twice
#   - queryFrequency (1h) exceeds queryPeriod (30m)
#   - with KQL validation enabled, the query has syntax typos ("sorty", "projectf")
id: b1c2d3e4-f5a6-7890-bcde-f12345678901

name: "Test Invalid Detection"
displayName: "Test Invalid Detection Display Name"
version: "1.0.0"
kind: "Scheduled"

# Valid metadata so the intentional errors below stand alone (Task 4 fields).
author: "contact.prokythera@gmail.com"
creationDate: 2026-01-01T09:00:00
reviewDate: 2027-06-01T09:00:00
environment: "Production"
tables:
  - "SecurityEvent"

description: "This is a test detection with intentional errors"

severity: "High"
enabled: true

# ERROR: queryFrequency exceeds queryPeriod
queryFrequency: "1h"
queryPeriod: "30m"

triggerOperator: "GreaterThan"
triggerThreshold: 0

# ERROR: tactic contains a space
tactics:
  - "Initial Access"

relevantTechniques:
  - "T1078"

# ERROR: Invalid KQL syntax (typos) - caught when KQL validation is enabled
query: |
  SecurityEvent
  | where EventID == 4625
  | sorty by TimeGenerated desc
  | projectf TimeGenerated, Computer, Account, IpAddress
  | extend AccountEntity = Account, Hostentity = Computer

suppressionEnabled: false

incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: false
    reopenClosedIncident: false
    lookbackDuration: "5m"
    matchingMethod: "AllEntities"
eventGroupingSettings:
  aggregationKind: "SingleAlert"

# ERROR: Entity mapping references column not in query output and too many field mappings
entityMappings:
  - entityype: "Account"
    fieldMappings:
      - identifier: "Name"
        columnName: "NonExistentColumn"
        fieldMappings:
      - identifier: "DnsDomain"
        columnName: "NonExistentColumn"
        fieldMappings:
      - identifier: "UPNSuffix"
        columnName: "NonExistentColumn"
        fieldMappings:
      - identifier: "Sid"
        columnName: "NonExistentColumn"
        fieldMappings:
      - identifier: "AadTenantId"
        columnName: "NonExistentColumn"
  - entityType: "Host"
    fieldMappings:
      - identifier: "HostName"
        columnName: "HostEntity"
customDetails:
  CompositeZScore: CompositeZScore
  CompositeZScore: CompositeZScore
